# Nedflix GitLab CI/CD Pipeline
# Builds desktop clients (Windows, Linux, macOS), mobile (Android, iOS),
# TV platforms (Android TV, Apple TV), and web version

stages:
  - test
  - build-server
  - build-desktop
  - build-mobile
  - build-tv
  - build-web
  - deploy
  - release

variables:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# =============================================================================
# Templates
# =============================================================================

# Base template for desktop builds - override before_script per platform
.desktop-cache:
  cache:
    key: desktop-$CI_JOB_NAME
    paths:
      - desktop/node_modules/
      - .cache/electron/
      - .cache/electron-builder/

.desktop-base-unix:
  extends: .desktop-cache
  before_script:
    - export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
    - cd desktop
    - npm install

.desktop-base-windows:
  extends: .desktop-cache
  before_script:
    - cd desktop
    - npm install

.web-base:
  before_script:
    - npm install
  cache:
    key: web-$CI_JOB_NAME
    paths:
      - node_modules/

.server-base:
  before_script:
    - npm install --production
  cache:
    key: server-$CI_JOB_NAME
    paths:
      - node_modules/

.android-base:
  before_script:
    - |
      if ! command -v java >/dev/null 2>&1; then
        echo "ERROR: Java not found. Please install JDK 17+ on this runner."
        echo "For Debian/Ubuntu: sudo apt install openjdk-17-jdk"
        exit 1
      fi
    - java -version
    - |
      if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
        echo "WARNING: ANDROID_HOME/ANDROID_SDK_ROOT not set"
        # Try common locations
        for sdk_path in ~/Android/Sdk /opt/android-sdk /usr/local/android-sdk; do
          if [ -d "$sdk_path" ]; then
            export ANDROID_HOME="$sdk_path"
            export ANDROID_SDK_ROOT="$sdk_path"
            echo "Found Android SDK at $sdk_path"
            break
          fi
        done
      fi
    - echo "ANDROID_HOME=$ANDROID_HOME"
  cache:
    key: android-$CI_JOB_NAME
    paths:
      - .gradle/
      - android/.gradle/
      - android/app/build/
      - androidtv/.gradle/
      - androidtv/app/build/
  allow_failure: true

.ios-base:
  tags:
    - macos
  before_script:
    - |
      if ! command -v xcodebuild >/dev/null 2>&1; then
        echo "ERROR: Xcode not found. Please install Xcode from the Mac App Store."
        echo "Command Line Tools alone are not sufficient for iOS builds."
        exit 1
      fi
    - xcodebuild -version
    - xcode-select -p
  cache:
    key: ios-$CI_JOB_NAME
    paths:
      - ios/build/
      - ~/Library/Developer/Xcode/DerivedData/
  allow_failure: true

.tvos-base:
  tags:
    - macos
  before_script:
    - |
      if ! command -v xcodebuild >/dev/null 2>&1; then
        echo "ERROR: Xcode not found. Please install Xcode from the Mac App Store."
        echo "Command Line Tools alone are not sufficient for tvOS builds."
        exit 1
      fi
    - xcodebuild -version
    - xcode-select -p
  cache:
    key: tvos-$CI_JOB_NAME
    paths:
      - appletv/build/
      - ~/Library/Developer/Xcode/DerivedData/
  allow_failure: true

# =============================================================================
# Test Stage
# =============================================================================

lint-desktop:
  stage: test
  tags:
    - linux
  extends: .desktop-base-unix
  script:
    - echo "Validating desktop package configuration..."
    - node -e "require('./package.json')"
    - echo "Desktop config valid"
  rules:
    - changes:
        - desktop/**/*

lint-web:
  stage: test
  tags:
    - linux
  extends: .web-base
  script:
    - echo "Validating web package configuration..."
    - node -e "require('./package.json')"
    - echo "Web config valid"
  rules:
    - changes:
        - package.json
        - server.js
        - public/**/*

lint-android:
  stage: test
  tags:
    - linux
  extends: .android-base
  script:
    - cd android
    - chmod +x gradlew setup-gradle-wrapper.sh
    - ./setup-gradle-wrapper.sh
    - ./gradlew lint --no-daemon
  rules:
    - changes:
        - android/**/*

lint-androidtv:
  stage: test
  tags:
    - linux
  extends: .android-base
  script:
    - cd androidtv
    - chmod +x gradlew setup-gradle-wrapper.sh
    - ./setup-gradle-wrapper.sh
    - ./gradlew lint --no-daemon
  rules:
    - changes:
        - androidtv/**/*

# =============================================================================
# Server Builds - Linux Headless Server
# =============================================================================

build-server-linux:
  stage: build-server
  tags:
    - linux
  extends: .server-base
  script:
    - chmod +x server/build.sh
    - ./server/build.sh
  artifacts:
    name: nedflix-server-linux
    paths:
      - dist/nedflix-server-*.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - server.js
        - package.json
        - public/**/*
        - server/**/*

build-server-docker:
  stage: build-server
  tags:
    - linux
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/server:$CI_COMMIT_REF_SLUG
    IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE/server:latest
  before_script:
    - |
      if ! command -v docker >/dev/null 2>&1; then
        echo "Docker not installed on this runner - skipping Docker build"
        exit 0
      fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -f Dockerfile .
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
        docker push $IMAGE_TAG_LATEST
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Dockerfile
        - server.js
        - package.json
        - public/**/*
  allow_failure: true

# =============================================================================
# Desktop Client Builds - Windows (Standalone + Remote Server Support)
# =============================================================================

build-desktop-windows-x64:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base-windows
  script:
    - npx electron-builder --win --x64 --publish never
  artifacts:
    name: nedflix-windows-x64
    paths:
      - desktop/dist/*.exe
      - desktop/dist/*.msi
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - desktop/**/*

build-desktop-windows-x86:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base-windows
  script:
    - npx electron-builder --win --ia32 --publish never
  artifacts:
    name: nedflix-desktop-windows-x86
    paths:
      - desktop/dist/*ia32*.exe
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-desktop-windows-portable:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base-windows
  script:
    - npx electron-builder --win portable --publish never
  artifacts:
