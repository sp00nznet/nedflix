    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - desktop/**/*

build-linux-arm64:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base
  script:
    - npx electron-builder --linux --arm64 --publish never
  artifacts:
    name: nedflix-linux-arm64
    paths:
      - desktop/dist/*arm64*.deb
      - desktop/dist/*arm64*.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-linux-deb:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base
  script:
    - npx electron-builder --linux deb --x64 --publish never
  artifacts:
    name: nedflix-linux-deb
    paths:
      - desktop/dist/*.deb
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-linux-appimage:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base
  script:
    - npx electron-builder --linux AppImage --x64 --publish never
  artifacts:
    name: nedflix-linux-appimage
    paths:
      - desktop/dist/*.AppImage
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# Desktop Builds - macOS
# =============================================================================

build-macos-x64:
