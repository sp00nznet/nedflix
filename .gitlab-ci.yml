# =============================================================================
# Mobile Builds - Android (requires JDK 17+ and Android SDK on runner)
# =============================================================================

build-android-debug:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - cd android
    - chmod +x gradlew setup-gradle-wrapper.sh
    - ./setup-gradle-wrapper.sh
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    name: nedflix-android-debug
    paths:
      - android/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - android/**/*

build-android-release:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - cd android
    - chmod +x gradlew setup-gradle-wrapper.sh
    - ./setup-gradle-wrapper.sh
    - ./gradlew assembleRelease --no-daemon
  artifacts:
    name: nedflix-android-release
    paths:
      - android/app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-android-bundle:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - cd android
    - chmod +x gradlew setup-gradle-wrapper.sh
    - ./setup-gradle-wrapper.sh
    - ./gradlew bundleRelease --no-daemon
  artifacts:
    name: nedflix-android-bundle
    paths:
      - android/app/build/outputs/bundle/release/*.aab
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# Mobile Builds - iOS
# =============================================================================

build-ios-simulator:
  stage: build-mobile
  extends: .ios-base
  script:
    - cd ios
    - xcodebuild -project Nedflix.xcodeproj \
        -scheme Nedflix \
        -configuration Release \
        -destination 'platform=iOS Simulator,name=iPhone 15' \
        -derivedDataPath build \
        clean build
  artifacts:
    name: nedflix-ios-simulator
    paths:
      - ios/build/Build/Products/Release-iphonesimulator/*.app
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - ios/**/*

build-ios-device:
  stage: build-mobile
  extends: .ios-base
  script:
    - cd ios
    - xcodebuild -project Nedflix.xcodeproj \
        -scheme Nedflix \
        -configuration Release \
        -destination 'generic/platform=iOS' \
        -derivedDataPath build \
        -archivePath build/Nedflix.xcarchive \
        archive
  artifacts:
    name: nedflix-ios-device
    paths:
      - ios/build/Nedflix.xcarchive
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-ios-ipa:
  stage: build-mobile
  extends: .ios-base
  script:
    - cd ios
    - |
      # Create ExportOptions.plist if not exists
      if [ ! -f ExportOptions.plist ]; then
        cat > ExportOptions.plist << 'EXPORTEOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>development</string>
        <key>teamID</key>
        <string>${APPLE_TEAM_ID}</string>
        <key>compileBitcode</key>
        <false/>
      </dict>
      </plist>
      EXPORTEOF
      fi
    - xcodebuild -project Nedflix.xcodeproj \
        -scheme Nedflix \
        -configuration Release \
        -destination 'generic/platform=iOS' \
        -archivePath build/Nedflix.xcarchive \
        archive
    - xcodebuild -exportArchive \
        -archivePath build/Nedflix.xcarchive \
        -exportPath build/ipa \
        -exportOptionsPlist ExportOptions.plist
  artifacts:
    name: nedflix-ios-ipa
    paths:
      - ios/build/ipa/*.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true

