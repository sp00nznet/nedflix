# =============================================================================
# TV Builds - Apple TV
# =============================================================================

build-appletv-client:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      # Check for Xcode project or create placeholder build
      if [ -d "NedflixTV.xcodeproj" ] || [ -d "NedflixTV" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Client \
          -configuration Release \
          -destination 'generic/platform=tvOS' \
          -derivedDataPath build/client \
          -archivePath build/client/NedflixTV-Client.xcarchive \
          archive
      elif [ -f "build-client.sh" ]; then
        chmod +x build-client.sh
        ./build-client.sh
      else
        echo "No Xcode project found - skipping Apple TV client build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-client
    paths:
      - appletv/build/client/*.xcarchive
      - appletv/build/client/*.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - appletv/**/*
  allow_failure: true

build-appletv-desktop:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      if [ -d "NedflixTV.xcodeproj" ] || [ -d "NedflixTV" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Desktop \
          -configuration Release \
          -destination 'generic/platform=tvOS' \
          -derivedDataPath build/desktop \
          -archivePath build/desktop/NedflixTV-Desktop.xcarchive \
          archive
      elif [ -f "build-desktop.sh" ]; then
        chmod +x build-desktop.sh
        ./build-desktop.sh
      else
        echo "No Xcode project found - skipping Apple TV desktop build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-desktop
    paths:
      - appletv/build/desktop/*.xcarchive
      - appletv/build/desktop/*.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true

build-appletv-simulator:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      if [ -d "NedflixTV.xcodeproj" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Client \
          -configuration Debug \
          -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
          -derivedDataPath build/simulator \
          clean build
      else
        echo "No Xcode project found - skipping Apple TV simulator build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-simulator
    paths:
      - appletv/build/simulator/Build/Products/Debug-appletvsimulator/*.app
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - appletv/**/*
  allow_failure: true

# =============================================================================
# Web Version Builds
# =============================================================================

build-web-docker:
  stage: build-web
  tags:
    - linux
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - |
      if ! command -v docker >/dev/null 2>&1; then
        echo "Docker not installed on this runner - skipping Docker build"
        exit 0
      fi
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
        docker push $IMAGE_TAG_LATEST
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Dockerfile
        - package.json
        - server.js
        - public/**/*
  allow_failure: true

build-web-static:
  stage: build-web
  tags:
    - linux
  extends: .web-base
  script:
    - echo "Building static web assets..."
    - mkdir -p dist/web
    - cp -r public/* dist/web/
    - cp package.json dist/web/
    - cp server.js dist/web/
    - cp *.js dist/web/ 2>/dev/null || true
    - echo "Static web build complete"
  artifacts:
    name: nedflix-web-static
    paths:
      - dist/web/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# Deploy Stage - Copy artifacts to shared releases mount
# =============================================================================

deploy-server-linux:
  stage: deploy
  tags:
    - linux
  needs:
    - job: build-server-linux
      artifacts: true
  script:
    - mkdir -p /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/server
    - cp -r dist/nedflix-server-*.tar.gz /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/server/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-desktop-linux:
  stage: deploy
  tags:
    - linux
  needs:
    - job: build-desktop-linux-x64
      artifacts: true
  script:
    - mkdir -p /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/desktop/linux
    - cp -r desktop/dist/*.deb desktop/dist/*.AppImage desktop/dist/*.tar.gz /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/desktop/linux/ 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-desktop-windows:
  stage: deploy
  tags:
    - windows
  needs:
    - job: build-desktop-windows-x64
      artifacts: true
    - job: build-desktop-windows-portable
      artifacts: true
      optional: true
  script:
    - 'net use R: /delete 2>$null; net use R: \\192.168.100.22\releases gitlab /user:root'
    - 'New-Item -ItemType Directory -Force -Path R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME\desktop\windows'
    - 'Copy-Item -Path desktop\dist\*.exe -Destination R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME\desktop\windows\ -Force'
    - 'Copy-Item -Path desktop\dist\*.msi -Destination R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME\desktop\windows\ -Force -ErrorAction SilentlyContinue'
    - 'net use R: /delete'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

deploy-desktop-macos:
  stage: deploy
  tags:
    - macos
  needs:
    - job: build-desktop-macos-x64
      artifacts: true
      optional: true
    - job: build-desktop-macos-universal
      artifacts: true
      optional: true
  script:
    - mkdir -p /tmp/releases
    - mount_smbfs //root:gitlab@192.168.100.22/releases /tmp/releases || true
    - mkdir -p /tmp/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/desktop/macos
    - cp -r desktop/dist/*.dmg desktop/dist/*.zip /tmp/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/desktop/macos/ 2>/dev/null || true
    - umount /tmp/releases || true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

deploy-mobile-android:
  stage: deploy
  tags:
    - linux
  needs:
    - job: build-android-release
      artifacts: true
      optional: true
    - job: build-android-bundle
      artifacts: true
      optional: true
  script:
    - mkdir -p /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/mobile/android
    - cp -r android/app/build/outputs/apk/release/*.apk /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/mobile/android/ 2>/dev/null || true
    - cp -r android/app/build/outputs/bundle/release/*.aab /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/mobile/android/ 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

deploy-tv-android:
  stage: deploy
  tags:
    - linux
  needs:
    - job: build-androidtv-client-release
      artifacts: true
      optional: true
    - job: build-androidtv-desktop-release
      artifacts: true
      optional: true
  script:
    - mkdir -p /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/tv/androidtv
    - cp -r androidtv/app/build/outputs/apk/*/release/*.apk /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/tv/androidtv/ 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

deploy-web:
  stage: deploy
  tags:
    - linux
  needs:
    - job: build-web-static
      artifacts: true
  script:
    - mkdir -p /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/web
    - cp -r dist/web/* /mnt/releases/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME/web/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Release Stage
# =============================================================================

release-create:
  stage: release
  tags:
    - linux
  before_script:
    - |
      # Install release-cli if not present
      if ! command -v release-cli >/dev/null 2>&1; then
        echo "Installing release-cli..."
        curl -L --output /tmp/release-cli "https://release-cli-downloads.s3.amazonaws.com/latest/release-cli-linux-amd64"
        chmod +x /tmp/release-cli
        export PATH="/tmp:$PATH"
      fi
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Nedflix $CI_COMMIT_TAG"
    description: |
      ## Nedflix $CI_COMMIT_TAG

      ### Server (Headless)
      - **Linux**: Headless server tar.gz with systemd service installer
      - **Docker**: `$CI_REGISTRY_IMAGE/server:$CI_COMMIT_TAG`

      ### Desktop Client (Standalone + Remote)
      - **Windows**: x64 installer, x86 installer, Portable
      - **Linux**: Debian package, AppImage, tar.gz (x64 & ARM64)
      - **macOS**: DMG (Intel, Apple Silicon, Universal)

      ### Mobile Downloads
      - **Android**: APK (debug/release), AAB (Play Store)
      - **iOS**: IPA (requires signing)

      ### TV Downloads
      - **Android TV**: Client APK, Desktop APK, AAB
      - **Apple TV**: Client IPA, Desktop IPA

      ### Web Version
      - Docker image: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`

      ### Installation
      See the [README](README.md) for installation instructions.
    assets:
      links:
        - name: "Linux Server (Headless)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-server-linux"
        - name: "Windows Desktop x64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-desktop-windows-x64"
        - name: "Windows Desktop Portable"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-desktop-windows-portable"
        - name: "Linux Desktop x64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-desktop-linux-x64"
        - name: "Linux Desktop AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-desktop-linux-appimage"
        - name: "macOS Desktop Universal"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-desktop-macos-universal"
        - name: "Android APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-android-release"
        - name: "Android Bundle (AAB)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-android-bundle"
        - name: "iOS Archive"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-ios-device"
        - name: "Android TV Client"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-androidtv-client-release"
        - name: "Android TV Desktop"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-androidtv-desktop-release"
        - name: "Apple TV Client"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-appletv-client"
        - name: "Web Static Build"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-web-static"
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# Manual/Local Build Jobs
# =============================================================================

build-all-local:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base-unix
  script:
    - echo "Building Linux desktop targets..."
    - npx electron-builder --linux --x64 --publish never || echo "Linux build completed or skipped"
  artifacts:
    name: nedflix-all-local
    paths:
      - desktop/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  allow_failure: true

build-all-mobile:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - echo "Building all Android targets..."
    - cd android && chmod +x gradlew setup-gradle-wrapper.sh && ./setup-gradle-wrapper.sh && ./gradlew assembleRelease --no-daemon
    - cd ../androidtv && chmod +x gradlew setup-gradle-wrapper.sh && ./setup-gradle-wrapper.sh && ./gradlew assembleRelease --no-daemon
  artifacts:
    name: nedflix-all-mobile
    paths:
      - android/app/build/outputs/apk/
      - androidtv/app/build/outputs/apk/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  allow_failure: true

# =============================================================================
# Scheduled Nightly Builds
# =============================================================================

nightly-build:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base-unix
  script:
    - npx electron-builder --linux --x64 --publish never
  artifacts:
    name: nedflix-nightly-$CI_COMMIT_SHORT_SHA
    paths:
      - desktop/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-mobile:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - cd android && chmod +x gradlew setup-gradle-wrapper.sh && ./setup-gradle-wrapper.sh && ./gradlew assembleDebug --no-daemon
    - cd ../androidtv && chmod +x gradlew setup-gradle-wrapper.sh && ./setup-gradle-wrapper.sh && ./gradlew :app:assembleClientDebug --no-daemon
  artifacts:
    name: nedflix-nightly-mobile-$CI_COMMIT_SHORT_SHA
    paths:
      - android/app/build/outputs/apk/debug/
      - androidtv/app/build/outputs/apk/client/debug/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
