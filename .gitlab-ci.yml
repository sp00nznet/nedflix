# =============================================================================
# TV Builds - Apple TV
# =============================================================================

build-appletv-client:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      # Check for Xcode project or create placeholder build
      if [ -d "NedflixTV.xcodeproj" ] || [ -d "NedflixTV" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Client \
          -configuration Release \
          -destination 'generic/platform=tvOS' \
          -derivedDataPath build/client \
          -archivePath build/client/NedflixTV-Client.xcarchive \
          archive
      elif [ -f "build-client.sh" ]; then
        chmod +x build-client.sh
        ./build-client.sh
      else
        echo "No Xcode project found - skipping Apple TV client build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-client
    paths:
      - appletv/build/client/*.xcarchive
      - appletv/build/client/*.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - appletv/**/*
  allow_failure: true

build-appletv-desktop:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      if [ -d "NedflixTV.xcodeproj" ] || [ -d "NedflixTV" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Desktop \
          -configuration Release \
          -destination 'generic/platform=tvOS' \
          -derivedDataPath build/desktop \
          -archivePath build/desktop/NedflixTV-Desktop.xcarchive \
          archive
      elif [ -f "build-desktop.sh" ]; then
        chmod +x build-desktop.sh
        ./build-desktop.sh
      else
        echo "No Xcode project found - skipping Apple TV desktop build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-desktop
    paths:
      - appletv/build/desktop/*.xcarchive
      - appletv/build/desktop/*.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true

build-appletv-simulator:
  stage: build-tv
  extends: .tvos-base
  script:
    - cd appletv
    - |
      if [ -d "NedflixTV.xcodeproj" ]; then
        xcodebuild -project NedflixTV.xcodeproj \
          -scheme NedflixTV-Client \
          -configuration Debug \
          -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
          -derivedDataPath build/simulator \
          clean build
      else
        echo "No Xcode project found - skipping Apple TV simulator build"
        exit 0
      fi
  artifacts:
    name: nedflix-appletv-simulator
    paths:
      - appletv/build/simulator/Build/Products/Debug-appletvsimulator/*.app
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - appletv/**/*
  allow_failure: true

# =============================================================================
# Web Version Builds
# =============================================================================

build-web-docker:
  stage: build-web
  tags:
    - docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
        docker push $IMAGE_TAG_LATEST
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Dockerfile
        - package.json
        - server.js
        - public/**/*

build-web-static:
  stage: build-web
  tags:
    - linux
  extends: .web-base
  script:
    - echo "Building static web assets..."
    - mkdir -p dist/web
    - cp -r public/* dist/web/
    - cp package.json dist/web/
    - cp server.js dist/web/
    - cp *.js dist/web/ 2>/dev/null || true
    - echo "Static web build complete"
  artifacts:
    name: nedflix-web-static
    paths:
      - dist/web/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# Release Stage
# =============================================================================

release-create:
  stage: release
  tags:
    - docker
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Nedflix $CI_COMMIT_TAG"
    description: |
      ## Nedflix $CI_COMMIT_TAG

      ### Desktop Downloads
      - **Windows**: x64 installer, x86 installer, Portable
      - **Linux**: Debian package, AppImage, tar.gz (x64 & ARM64)
      - **macOS**: DMG (Intel, Apple Silicon, Universal)

      ### Mobile Downloads
      - **Android**: APK (debug/release), AAB (Play Store)
      - **iOS**: IPA (requires signing)

      ### TV Downloads
      - **Android TV**: Client APK, Desktop APK, AAB
      - **Apple TV**: Client IPA, Desktop IPA

      ### Web Version
      - Docker image: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`

      ### Installation
      See the [README](README.md) for installation instructions.
    assets:
      links:
        - name: "Windows x64 Installer"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-windows-x64"
        - name: "Windows Portable"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-windows-portable"
        - name: "Linux x64 (All formats)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-linux-x64"
        - name: "Linux AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-linux-appimage"
        - name: "macOS Universal"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-macos-universal"
        - name: "Android APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-android-release"
        - name: "Android Bundle (AAB)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-android-bundle"
        - name: "iOS Archive"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-ios-device"
        - name: "Android TV Client"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-androidtv-client-release"
        - name: "Android TV Desktop"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-androidtv-desktop-release"
        - name: "Apple TV Client"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-appletv-client"
        - name: "Web Static Build"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build-web-static"
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# Manual/Local Build Jobs
# =============================================================================

build-all-local:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base
  script:
    - echo "Building Linux desktop targets..."
    - npx electron-builder --linux --x64 --publish never || echo "Linux build completed or skipped"
  artifacts:
    name: nedflix-all-local
    paths:
      - desktop/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  allow_failure: true

build-all-mobile:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - echo "Building all Android targets..."
    - cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
    - cd ../androidtv && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
  artifacts:
    name: nedflix-all-mobile
    paths:
      - android/app/build/outputs/apk/
      - androidtv/app/build/outputs/apk/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  allow_failure: true

# =============================================================================
# Scheduled Nightly Builds
# =============================================================================

nightly-build:
  stage: build-desktop
  tags:
    - linux
  extends: .desktop-base
  script:
    - npx electron-builder --linux --x64 --publish never
  artifacts:
    name: nedflix-nightly-$CI_COMMIT_SHORT_SHA
    paths:
      - desktop/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-mobile:
  stage: build-mobile
  tags:
    - linux
  extends: .android-base
  script:
    - cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
    - cd ../androidtv && chmod +x gradlew && ./gradlew :app:assembleClientDebug --no-daemon
  artifacts:
