# Nedflix GitLab CI/CD Pipeline
# Builds desktop clients (Windows, Linux, macOS), mobile (Android, iOS),
# TV platforms (Android TV, Apple TV), and web version

stages:
  - test
  - build-desktop
  - build-mobile
  - build-tv
  - build-web
  - release

variables:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# =============================================================================
# Templates
# =============================================================================

.desktop-base:
  before_script:
    - |
      # Ensure Node.js binaries are in PATH (for macOS homebrew installs)
      export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
    - cd desktop
    - npm install
  cache:
    key: desktop-$CI_JOB_NAME
    paths:
      - desktop/node_modules/
      - .cache/electron/
      - .cache/electron-builder/

.web-base:
  before_script:
    - npm install
  cache:
    key: web-$CI_JOB_NAME
    paths:
      - node_modules/

.android-base:
  before_script:
    - java -version || echo "Java not found - please install JDK 17+"
    - echo "ANDROID_HOME=$ANDROID_HOME"
  cache:
    key: android-$CI_JOB_NAME
    paths:
      - .gradle/
      - android/.gradle/
      - android/app/build/
      - androidtv/.gradle/
      - androidtv/app/build/

.ios-base:
  tags:
    - macos
  before_script:
    - xcodebuild -version
    - xcode-select -p
  cache:
    key: ios-$CI_JOB_NAME
    paths:
      - ios/build/
      - ~/Library/Developer/Xcode/DerivedData/

.tvos-base:
  tags:
    - macos
  before_script:
    - xcodebuild -version
    - xcode-select -p
  cache:
    key: tvos-$CI_JOB_NAME
    paths:
      - appletv/build/
      - ~/Library/Developer/Xcode/DerivedData/

# =============================================================================
# Test Stage
# =============================================================================

lint-desktop:
  stage: test
  tags:
    - linux
  extends: .desktop-base
  script:
    - echo "Validating desktop package configuration..."
    - node -e "require('./package.json')"
    - echo "Desktop config valid"
  rules:
    - changes:
        - desktop/**/*

lint-web:
  stage: test
  tags:
    - linux
  extends: .web-base
  script:
    - echo "Validating web package configuration..."
    - node -e "require('./package.json')"
    - echo "Web config valid"
  rules:
    - changes:
        - package.json
        - server.js
        - public/**/*

lint-android:
  stage: test
  tags:
    - linux
  extends: .android-base
  script:
    - cd android
    - chmod +x gradlew
    - ./gradlew lint --no-daemon
  rules:
    - changes:
        - android/**/*
  allow_failure: true

lint-androidtv:
  stage: test
  tags:
    - linux
  extends: .android-base
  script:
    - cd androidtv
    - chmod +x gradlew
    - ./gradlew lint --no-daemon
  rules:
    - changes:
        - androidtv/**/*
  allow_failure: true

# =============================================================================
# Desktop Builds - Windows (native Windows runner)
# =============================================================================

build-windows-x64:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base
  script:
    - npx electron-builder --win --x64 --publish never
  artifacts:
    name: nedflix-windows-x64
    paths:
      - desktop/dist/*.exe
      - desktop/dist/*.msi
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - desktop/**/*

build-windows-x86:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base
  script:
    - npx electron-builder --win --ia32 --publish never
  artifacts:
    name: nedflix-windows-x86
    paths:
      - desktop/dist/*ia32*.exe
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

build-windows-portable:
  stage: build-desktop
  tags:
    - windows
  extends: .desktop-base
  script:
    - npx electron-builder --win portable --publish never
  artifacts:
    name: nedflix-windows-portable
    paths:
      - desktop/dist/*Portable*.exe
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# Desktop Builds - Linux (shell executor on Debian)
# =============================================================================

build-linux-x64:
  stage: build-desktop
  tags:
